spring.datasource.url=jdbc:postgresql://localhost:5432/payroll_db?options=-c%20TimeZone=UTC
spring.datasource.username=payroll_user
spring.datasource.password=payroll_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

payroll.tax-rate=0.10

app.security.seed-admin-username=${APP_SECURITY_SEED_ADMIN_USERNAME}
app.security.seed-admin-password=${APP_SECURITY_SEED_ADMIN_PASSWORD}

app.security.seed-hr-username=${APP_SECURITY_SEED_HR_USERNAME}
app.security.seed-hr-password=${APP_SECURITY_SEED_HR_PASSWORD}

app.security.seed-employee-username=${APP_SECURITY_SEED_EMPLOYEE_USERNAME}
app.security.seed-employee-password=${APP_SECURITY_SEED_EMPLOYEE_PASSWORD}
app.security.seed-employee-id=${APP_SECURITY_SEED_EMPLOYEE_ID}

app.security.jwt-secret=${APP_SECURITY_JWT_SECRET}
app.security.jwt-expiration-ms=${APP_SECURITY_JWT_EXPIRATION_MS:3600000}